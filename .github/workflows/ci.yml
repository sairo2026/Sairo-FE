name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks and build
        run: npm run check

      - name: Verify mock API is excluded from the production bundle
        run: npm run check:bundle

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with mock API
        run: npm run build
        env:
          NEXT_PUBLIC_API_MOCKING: enabled

      - name: Verify the bundle check detects the mock API build
        run: npm run check:bundle -- --expect-mock

      - name: Run browser tests
        run: npm run e2e -- --project=desktop --project=mobile
        env:
          HOME: /root

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with mock API
        run: npm run build
        env:
          NEXT_PUBLIC_API_MOCKING: enabled

      - name: Run Firefox and WebKit smoke tests
        run: >-
          npx playwright test e2e/report-only-csp.spec.ts e2e/ops-refund-reprocess.spec.ts
          --project=firefox-smoke --project=webkit-smoke --project=mobile-webkit-smoke
        env:
          HOME: /root

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-browser-smoke-report
          path: playwright-report
          retention-days: 7
