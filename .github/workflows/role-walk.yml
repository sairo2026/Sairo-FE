name: Role walk

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/roles/**"
      - ".github/workflows/role-walk.yml"

jobs:
  walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_API_MOCKING: enabled
      - name: Run role walk
        run: npx playwright test e2e/roles/role-walk.spec.ts --project=desktop --retries=0
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: role-walk-report
          path: |
            role-walk-report
            playwright-report
          retention-days: 7
